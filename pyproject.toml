[project]
name = "qlogix"
version = "1.2.1"
description = "qlogix is an AI-powered platform for collecting, analyzing, and visualizing logs from multiple sources."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.13.0",
    "openai>=1.0.0",
    "pydantic>=2.13.4",
    "ssh2-python>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src/qlogix"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[project.scripts]
qlogix-cli = "qlogix.cli:run"
